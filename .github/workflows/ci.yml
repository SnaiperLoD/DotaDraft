name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build (shared + server + client)
        run: npm run build

      - name: Lint (non-blocking until scripts pile is scoped)
        run: npm run lint
        continue-on-error: true

      - name: Format check (non-blocking until scripts pile is scoped)
        run: npm run format:check
        continue-on-error: true

      - name: Typecheck server
        run: npx tsc -p server/tsconfig.json --noEmit

      - name: Typecheck client
        run: npx tsc -p client/tsconfig.json --noEmit

      - name: Server unit tests
        run: npx jest --ci
        working-directory: server

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run test:e2e
        env:
          CI: true
          POOL_DATABASE_URL: ''

      - name: Docker build (api + web)
        run: docker compose build

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
