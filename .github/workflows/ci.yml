name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dota
          POSTGRES_PASSWORD: dota
          POSTGRES_DB: opponent_pool
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dota -d opponent_pool"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: npm audit (production deps)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Generate Prisma clients
        run: npm run prisma:generate

      - name: Build (shared + server + client)
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck server
        run: npx tsc -p server/tsconfig.build.json --noEmit

      - name: Typecheck client
        run: npx tsc -p client/tsconfig.json --noEmit

      - name: Server unit tests
        run: npx jest --ci
        working-directory: server
        env:
          POOL_DATABASE_URL: ''

      - name: Client unit tests
        run: npm test --workspace client

      - name: Server integration tests
        run: npm run test:integration --workspace server
        env:
          POOL_DATABASE_URL: ''

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run test:e2e
        env:
          CI: true
          POOL_DATABASE_URL: postgresql://dota:dota@localhost:5432/opponent_pool

      - name: Docker build (api + web)
        run: docker compose build

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
