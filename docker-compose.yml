services:
  pool:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dota
      POSTGRES_PASSWORD: dota
      POSTGRES_DB: opponent_pool
    volumes:
      - dota-draft-pool:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dota -d opponent_pool']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: '3001'
      DATABASE_URL: file:/data/prod.db
      # Comma-separated browser origins if the SPA is not same-origin.
      # Leave empty when nginx fronts both (recommended).
      CORS_ORIGIN: ''
      POOL_DATABASE_URL: postgresql://dota:dota@pool:5432/opponent_pool
      TELEMETRY_READ_TOKEN: ${TELEMETRY_READ_TOKEN:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      AUTH_PUBLIC_ORIGIN: ${AUTH_PUBLIC_ORIGIN:-}
    volumes:
      - dota-draft-data:/data
    expose:
      - '3001'
    depends_on:
      pool:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.client
    ports:
      # Loopback only: local Docker Desktop still hits http://localhost:8080.
      # Public HTTPS is Cloudflare Tunnel (docker-compose.tunnel.yml), not :8080.
      - '127.0.0.1:8080:80'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dota-draft-data:
  dota-draft-pool:
